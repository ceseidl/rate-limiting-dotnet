name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --nologo

      - name: Smoke test (API + demo client)
        run: |
          dotnet run --no-build --project src/RateLimitApi > api.log 2>&1 &
          out=$(timeout 120 dotnet run --no-build --project src/RateLimitDemo)
          echo "$out"
          echo "$out" | grep -E 'Fixed window.* 200 200 200 200 200 429 429'
          echo "$out" | grep -E 'Sliding window.* 200 200 200 200 200 429 429'
          echo "$out" | grep -E 'free-1.* 200 200 200 429 429'
          echo "$out" | grep -E 'premium-1.* 200 200 200 200 200$'
          echo "$out" | grep -E 'saude.* 200 200 200$'

      - name: Smoke test (custom port)
        run: |
          # EN: The API URL is configurable: --urls on the API, RATE_LIMIT_API_URL on the demo.
          # PT: A URL da API é configurável: --urls na API, RATE_LIMIT_API_URL na demo.
          dotnet run --no-build --project src/RateLimitApi --urls http://localhost:5081 > api2.log 2>&1 &
          out=$(RATE_LIMIT_API_URL=http://localhost:5081 timeout 120 dotnet run --no-build --project src/RateLimitDemo)
          echo "$out"
          echo "$out" | grep -F 'http://localhost:5081'
          echo "$out" | grep -E 'Fixed window.* 200 200 200 200 200 429 429'

      - name: API log
        if: always()
        run: cat api.log api2.log || true
